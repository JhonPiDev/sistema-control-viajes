# Render Blueprint - Sistema de Control de Viajes (backend + BD)
#
# Uso: sube el repo a GitHub, en Render New > Blueprint, "Blueprint Path"
# = deploy/render.yaml. Crea 1 Postgres + 3 Web Services (plan free).
#
# Nota: el plan free no permite tráfico entrante por red privada, así que
# trips-service y operations-service se llaman por su URL pública,
# protegida con INTERNAL_API_KEY (ver envVarGroups). Tras el primer
# deploy, verifica en el dashboard la URL real de cada servicio y
# actualiza TRIPS_SERVICE_URL / OPERATIONS_SERVICE_URL si difieren de los
# valores por defecto de abajo (pueden traer un sufijo si el nombre ya
# estaba tomado).

envVarGroups:
  - name: internal-shared
    envVars:
      # Mismo valor generado una sola vez y compartido por los 3 servicios
      # backend, para autenticar las llamadas HTTP internas entre ellos.
      - key: INTERNAL_API_KEY
        generateValue: true

databases:
  - name: viajes-postgres
    plan: free
    databaseName: trips_db
    user: viajes_admin

services:
  # ---------------- trips-service (Web Service, API interna) ----------------
  - type: web
    name: trips-service
    runtime: docker
    plan: free
    dockerfilePath: ./backend/trips-service/Dockerfile
    dockerContext: ./backend/trips-service
    healthCheckPath: /health
    envVars:
      - fromGroup: internal-shared
      - key: DATABASE_URL
        fromDatabase:
          name: viajes-postgres
          property: connectionString

  # ---------------- operations-service (Web Service, API interna) ----------------
  - type: web
    name: operations-service
    runtime: docker
    plan: free
    dockerfilePath: ./backend/operations-service/Dockerfile
    dockerContext: ./backend/operations-service
    healthCheckPath: /health
    envVars:
      - fromGroup: internal-shared
      # Reutiliza el mismo servidor Postgres con otra BD lógica; en
      # producción real conviene una BD separada.
      - key: DATABASE_URL
        fromDatabase:
          name: viajes-postgres
          property: connectionString
      - key: TRIPS_SERVICE_URL
        value: https://trips-service.onrender.com # valor inicial; se corrige a mano en el dashboard tras el primer deploy
        sync: false # evita que Render pise el valor real cada vez que sincroniza el Blueprint

  # ---------------- api-gateway (público, único con documentación Swagger) ----------------
  - type: web
    name: api-gateway
    runtime: docker
    plan: free
    dockerfilePath: ./backend/api-gateway/Dockerfile
    dockerContext: ./backend/api-gateway
    healthCheckPath: /api/health
    envVars:
      - fromGroup: internal-shared
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGIN
        value: "*" # valor inicial; se corrige a mano en el dashboard con la URL real del frontend
        sync: false # evita que Render pise el valor real cada vez que sincroniza el Blueprint
      - key: TRIPS_SERVICE_URL
        value: https://trips-service.onrender.com # valor inicial; se corrige a mano en el dashboard tras el primer deploy
        sync: false # evita que Render pise el valor real cada vez que sincroniza el Blueprint
      - key: OPERATIONS_SERVICE_URL
        value: https://operations-service.onrender.com # valor inicial; se corrige a mano en el dashboard tras el primer deploy
        sync: false # evita que Render pise el valor real cada vez que sincroniza el Blueprint
      - key: TRIP_RETENTION_DAYS
        value: "90" # días que se conservan los viajes finalizados antes de borrarse solos
